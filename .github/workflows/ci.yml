name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install LLVM 18
        run: |
          curl --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 -fsSLo llvm.sh https://apt.llvm.org/llvm.sh
          echo '03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae  llvm.sh' | sha256sum -c -
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y llvm-18-dev clang-18 lld-18

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            bc \
            jq

      - name: Set up LLVM environment
        run: |
          echo "PATH=/usr/lib/llvm-18/bin:$PATH" >> $GITHUB_ENV
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Build LLVM pass
        working-directory: backend/llvm-pass
        run: |
          mkdir -p build && cd build
          cmake .. \
            -G Ninja \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
          ninja

      - name: Build runtime library
        working-directory: backend/runtime
        run: |
          mkdir -p build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang-18
          ninja
          ctest --output-on-failure

      - name: Build cache simulator
        working-directory: backend/cache-simulator
        run: |
          mkdir -p build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18
          ninja

      - name: Run all unit tests
        working-directory: backend/cache-simulator/build
        run: |
          for test in ./*Test; do
            if [ -x "$test" ]; then
              echo "Running $test..."
              $test || exit 1
            fi
          done

      - name: Check hardware profile drift
        run: node tests/integration/check-profile-drift.mjs

      - name: Verify CLI tools exist
        run: |
          ls -la backend/scripts/cache-explore*
          test -x backend/scripts/hardware-explore

      - name: Validate calibration evidence packets
        run: backend/scripts/cache-explore calibration

      - name: Run E2E tests
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          ./tests/e2e/run_tests.sh

      - name: Run integration feature and snapshot gates
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          mkdir -p reports/workloads
          export CACHE_EXPLORER_WORKLOAD_HISTORY="$PWD/reports/workloads/workload-history.json"
          ./tests/integration/test-features.sh
          ./tests/integration/test-golden-kernels.sh
          ./tests/integration/test-workload-snapshots.sh

      - name: Summarize workload benchmark history
        if: always()
        run: |
          if compgen -G "reports/workloads/workload-history*.json" > /dev/null; then
            backend/scripts/cache-explore workloads --history-summary reports/workloads/workload-history*.json \
              | tee reports/workloads/workload-history-summary.txt
            backend/scripts/cache-explore workloads --history-summary reports/workloads/workload-history*.json --json \
              > reports/workloads/workload-history-summary.json
            backend/scripts/cache-explore workloads --history-summary reports/workloads/workload-history*.json --html \
              > reports/workloads/workload-history-report.html
            {
              echo "### Workload benchmark history"
              echo '```'
              cat reports/workloads/workload-history-summary.txt
              echo '```'
              echo
              echo "HTML trend report is available in the workload-benchmark-history artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No workload benchmark history was generated."
          fi

      - name: Upload workload benchmark history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workload-benchmark-history
          path: |
            reports/workloads/*.json
            reports/workloads/*.txt
            reports/workloads/*.html
          if-no-files-found: ignore

  server:
    name: Server Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: backend/server/package-lock.json

      - name: Install dependencies
        working-directory: backend/server
        run: npm ci

      - name: Lint (if available)
        working-directory: backend/server
        run: npm run lint || true

      - name: Run server tests
        working-directory: backend/server
        run: npm test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check CSS design tokens
        working-directory: frontend
        run: npm run tokens:check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check frontend bundle budget
        working-directory: frontend
        run: npm run bundle:check

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1

      - name: Run UI smoke
        working-directory: frontend
        run: npm run smoke:ui

      - name: Run visual smoke
        working-directory: frontend
        run: npm run visual:check

  vscode-extension:
    name: VS Code Extension Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19'

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm install

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Lint extension
        working-directory: vscode-extension
        run: npm run lint

  local-product-smoke:
    name: Local Product (Docker + Real Browser)
    runs-on: ubuntu-latest
    needs: [server, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Install browser smoke dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1

      - name: Build and start the local product
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Run the real default journey
        working-directory: frontend
        run: npm run smoke:live

      - name: Capture product logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the local product
        if: always()
        run: docker compose down --volumes
