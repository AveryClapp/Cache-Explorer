name: Hardware Explorer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example, v1.8.0-preview.1)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a Preview prerelease'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build LLVM ${{ matrix.llvm-version }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        llvm-version: [17, 18, 19, 20, 21]
        os: [ubuntu-22.04, macos-14]
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }}
          sudo apt-get install -y llvm-${{ matrix.llvm-version }}-dev ninja-build

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ matrix.llvm-version }} ninja

      - name: Build CacheProfiler.so
        run: |
          chmod +x ./backend/scripts/build-passes.sh
          ./backend/scripts/build-passes.sh ${{ matrix.llvm-version }} ./passes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheProfiler-llvm${{ matrix.llvm-version }}-${{ matrix.platform }}
          path: ./passes/CacheProfiler-llvm${{ matrix.llvm-version }}-*.so
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find ./artifacts -name "*.so" -exec cp {} ./release-assets/ \;
          cd release-assets
          sha256sum *.so | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          cd ..
          ls -la ./release-assets/

      - name: Determine tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-checksums: ./release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: Hardware Explorer ${{ steps.get-tag.outputs.tag }}
          files: |
            ./release-assets/*.so
            ./release-assets/SHA256SUMS
          draft: false
          prerelease: ${{ contains(steps.get-tag.outputs.tag, '-') || (github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch release validation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: gh workflow run release-validation.yml --ref main -f tag="$TAG"
