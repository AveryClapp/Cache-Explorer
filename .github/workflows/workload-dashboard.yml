name: Workload Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workload-dashboard
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Workload Dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y llvm-18-dev clang-18 lld-18

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            bc \
            jq

      - name: Set up LLVM environment
        run: |
          echo "PATH=/usr/lib/llvm-18/bin:$PATH" >> "$GITHUB_ENV"
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CC=/usr/lib/llvm-18/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-18/bin/clang++" >> "$GITHUB_ENV"

      - name: Build analysis toolchain
        run: ./scripts/build.sh Release

      - name: Restore retained workload history
        uses: actions/cache@v4
        with:
          path: reports/workloads/history-cache
          key: workload-history-${{ github.run_id }}
          restore-keys: |
            workload-history-

      - name: Restore published workload history
        env:
          CACHE_EXPLORER_DASHBOARD_BASE_URL: ${{ vars.CACHE_EXPLORER_DASHBOARD_BASE_URL }}
        run: |
          mkdir -p reports/workloads/history-cache
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          pages_base="${CACHE_EXPLORER_DASHBOARD_BASE_URL:-https://${owner}.github.io/${repo}}"
          pages_base="${pages_base%/}"
          echo "Restoring published workload history from ${pages_base}"

          if ! curl -fsSL "${pages_base}/workload-history-index.json" -o /tmp/workload-history-index.json; then
            echo "No published workload history index found."
            exit 0
          fi

          jq -r '.files[]?.file // empty' /tmp/workload-history-index.json \
            | while IFS= read -r file; do
                case "$file" in
                  workload-history*.json)
                    curl -fsSL "${pages_base}/${file}" \
                      -o "reports/workloads/history-cache/${file}" \
                      || echo "Could not restore ${file}"
                    ;;
                esac
              done
          ls -1 reports/workloads/history-cache || true

      - name: Verify workloads with history
        run: |
          mkdir -p reports/workloads/history-cache
          export CACHE_EXPLORER_WORKLOAD_HISTORY="$PWD/reports/workloads/history-cache/workload-history-${GITHUB_RUN_ID}.json"
          ./tests/integration/test-workload-snapshots.sh

      - name: Prune retained workload history
        run: |
          find reports/workloads/history-cache -type f -name 'workload-history*.json' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | awk 'NR > 30 { print $2 }' \
            | xargs -r rm -f
          ls -1 reports/workloads/history-cache

      - name: Render dashboard
        run: |
          mkdir -p site
          backend/scripts/cache-explore workloads --history-summary reports/workloads/history-cache/workload-history*.json \
            | tee site/workload-history-summary.txt
          backend/scripts/cache-explore workloads --history-summary reports/workloads/history-cache/workload-history*.json --json \
            > site/workload-history-summary.json
          backend/scripts/cache-explore workloads --history-summary reports/workloads/history-cache/workload-history*.json --html \
            > site/index.html
          cp reports/workloads/history-cache/workload-history*.json site/
          node <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('fs')
          const files = readdirSync('site')
            .filter(file => /^workload-history.*\.json$/.test(file))
            .sort()
          const history = files.map(file => {
            const record = JSON.parse(readFileSync(`site/${file}`, 'utf8'))
            return {
              file,
              generatedAt: record.generatedAt,
              ok: record.summary?.ok,
              passed: record.summary?.passed,
              failed: record.summary?.failed,
              durationMs: record.summary?.durationMs,
              git: record.git,
            }
          })
          writeFileSync('site/workload-history-index.json', `${JSON.stringify({
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            files: history,
          }, null, 2)}\n`)
          NODE
          {
            echo "### Workload dashboard"
            echo
            echo "Published dashboard will include up to 30 retained workload-history runs restored from Pages and the Actions cache."
            echo
            echo '```'
            cat site/workload-history-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
