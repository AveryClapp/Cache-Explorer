name: Release Validation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  attestations: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cache-explorer
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  validate:
    name: Validate Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release-validation
          gh release download "$TAG" \
            --repo "$REPO" \
            --dir release-validation \
            --pattern 'CacheProfiler-*.so' \
            --pattern 'SHA256SUMS'
          test -s release-validation/SHA256SUMS
          ls -la release-validation

      - name: Verify checksums and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd release-validation
          sha256sum -c SHA256SUMS
          for asset in CacheProfiler-*.so; do
            gh attestation verify "$asset" --repo "$REPO"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate published Docker images
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          image_tag="${TAG#v}"
          for image in sandbox backend frontend; do
            ref="${REGISTRY}/${IMAGE_PREFIX}-${image}:${image_tag}"
            echo "Checking ${ref}"
            found=0
            for attempt in $(seq 1 24); do
              if docker buildx imagetools inspect "$ref" >/dev/null; then
                found=1
                break
              fi
              echo "Image not available yet (${attempt}/24); waiting 30s..."
              sleep 30
            done
            if [ "$found" -ne 1 ]; then
              echo "Missing published image: ${ref}" >&2
              exit 1
            fi
          done
