name: Release Validation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  attestations: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cache-explorer
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  validate:
    name: Validate Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release-validation
          gh release download "$TAG" \
            --repo "$REPO" \
            --dir release-validation \
            --pattern 'CacheProfiler-*.so' \
            --pattern 'SHA256SUMS'
          test -s release-validation/SHA256SUMS
          ls -la release-validation

      - name: Verify checksums and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd release-validation
          sha256sum -c SHA256SUMS
          for asset in CacheProfiler-*.so; do
            gh attestation verify "$asset" --repo "$REPO"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate published Docker images
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          image_tag="${TAG#v}"
          for image in sandbox backend frontend; do
            ref="${REGISTRY}/${IMAGE_PREFIX}-${image}:${image_tag}"
            echo "Checking ${ref}"
            found=0
            for attempt in $(seq 1 24); do
              if docker buildx imagetools inspect "$ref" >/dev/null; then
                found=1
                break
              fi
              echo "Image not available yet (${attempt}/24); waiting 30s..."
              sleep 30
            done
            if [ "$found" -ne 1 ]; then
              echo "Missing published image: ${ref}" >&2
              exit 1
            fi
          done

      - name: Archive published workload history
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          CACHE_EXPLORER_DASHBOARD_BASE_URL: ${{ vars.CACHE_EXPLORER_DASHBOARD_BASE_URL }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_base="${CACHE_EXPLORER_DASHBOARD_BASE_URL:-https://${owner}.github.io/${repo_name}}"
          pages_base="${pages_base%/}"
          archive_dir="workload-history-${TAG}"
          archive_file="${archive_dir}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Fetching workload history from ${pages_base}"
          if ! curl -fsSL "${pages_base}/workload-history-index.json" -o "${archive_dir}/workload-history-index.json"; then
            echo "No published workload history index found; skipping release history archive."
            exit 0
          fi

          export ARCHIVE_DIR="$archive_dir"
          node <<'NODE' > /tmp/workload-history-files.txt
          const { readFileSync } = require('fs')
          const index = JSON.parse(readFileSync(`${process.env.ARCHIVE_DIR}/workload-history-index.json`, 'utf8'))
          for (const entry of index.files || []) {
            if (/^workload-history.*\.json$/.test(entry.file || '')) {
              console.log(entry.file)
            }
          }
          NODE

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            curl -fsSL "${pages_base}/${file}" -o "${archive_dir}/${file}"
          done < /tmp/workload-history-files.txt

          tar -czf "$archive_file" "$archive_dir"
          gh release upload "$TAG" "$archive_file" --repo "$REPO" --clobber
