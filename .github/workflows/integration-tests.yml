name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        llvm: [18, 19, 20, 21]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: backend/server/package-lock.json

      - name: Install LLVM (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 -fsSLo llvm.sh https://apt.llvm.org/llvm.sh
          echo '03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae  llvm.sh' | sha256sum -c -
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }}-dev

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ matrix.llvm }}
          echo "/opt/homebrew/opt/llvm@${{ matrix.llvm }}/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build cmake jq bc libboost-system-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install ninja cmake jq bc boost
          fi

      - name: Install server dependencies
        working-directory: backend/server
        run: npm ci --omit=dev

      - name: Build cache simulator
        run: |
          rm -rf backend/cache-simulator/build
          mkdir -p backend/cache-simulator/build
          cd backend/cache-simulator/build
          cmake .. -G Ninja
          ninja

      - name: Build runtime library
        run: |
          rm -rf backend/runtime/build
          mkdir -p backend/runtime/build
          cd backend/runtime/build
          cmake .. -G Ninja
          ninja
          ctest --output-on-failure

      - name: Build LLVM pass
        run: |
          # Clean build directory to avoid stale artifacts
          rm -rf backend/llvm-pass/build
          mkdir -p backend/llvm-pass/build
          cd backend/llvm-pass/build

          # Set environment to use correct LLVM version
          if [ "$RUNNER_OS" == "Linux" ]; then
            export PATH="/usr/lib/llvm-${{ matrix.llvm }}/bin:$PATH"
            export CC="/usr/lib/llvm-${{ matrix.llvm }}/bin/clang"
            export CXX="/usr/lib/llvm-${{ matrix.llvm }}/bin/clang++"
            export LD_LIBRARY_PATH="/usr/lib/llvm-${{ matrix.llvm }}/lib:$LD_LIBRARY_PATH"
            cmake .. -G Ninja \
              -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/llvm \
              -DCMAKE_PREFIX_PATH=/usr/lib/llvm-${{ matrix.llvm }}
          else
            export PATH="/opt/homebrew/opt/llvm@${{ matrix.llvm }}/bin:$PATH"
            export CC="/opt/homebrew/opt/llvm@${{ matrix.llvm }}/bin/clang"
            export CXX="/opt/homebrew/opt/llvm@${{ matrix.llvm }}/bin/clang++"
            cmake .. -G Ninja \
              -DLLVM_DIR=/opt/homebrew/opt/llvm@${{ matrix.llvm }}/lib/cmake/llvm \
              -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/llvm@${{ matrix.llvm }}
          fi

          # Verify LLVM version
          echo "Building with:"
          $CC --version | head -1

          ninja

      - name: Fix macOS SDK path (if needed)
        if: runner.os == 'macOS'
        run: |
          SDK_PATH=$(xcrun --show-sdk-path)
          mkdir -p /opt/homebrew/etc/clang
          echo "-isysroot $SDK_PATH" > /opt/homebrew/etc/clang/$(uname -m)-apple-darwin$(uname -r | cut -d. -f1).cfg || true

      - name: Run integration tests
        run: |
          # Set environment to use the correct LLVM version
          if [ "$RUNNER_OS" == "Linux" ]; then
            export PATH="/usr/lib/llvm-${{ matrix.llvm }}/bin:$PATH"
            export CACHE_EXPLORER_CC="/usr/lib/llvm-${{ matrix.llvm }}/bin/clang"
            export CACHE_EXPLORER_CXX="/usr/lib/llvm-${{ matrix.llvm }}/bin/clang++"
          else
            export PATH="/opt/homebrew/opt/llvm@${{ matrix.llvm }}/bin:$PATH"
            export CACHE_EXPLORER_CC="/opt/homebrew/opt/llvm@${{ matrix.llvm }}/bin/clang"
            export CACHE_EXPLORER_CXX="/opt/homebrew/opt/llvm@${{ matrix.llvm }}/bin/clang++"
          fi
          mkdir -p reports/workloads
          export CACHE_EXPLORER_WORKLOAD_HISTORY="$PWD/reports/workloads/workload-history-${{ matrix.os }}-llvm${{ matrix.llvm }}.json"
          cd tests/integration
          ./run-all-tests.sh

      - name: Summarize workload benchmark history
        if: always()
        run: |
          if compgen -G "reports/workloads/workload-history*.json" > /dev/null; then
            backend/scripts/cache-explore workloads --history-summary reports/workloads/workload-history*.json \
              | tee reports/workloads/workload-history-summary-${{ matrix.os }}-llvm${{ matrix.llvm }}.txt
            backend/scripts/cache-explore workloads --history-summary reports/workloads/workload-history*.json --json \
              > reports/workloads/workload-history-summary-${{ matrix.os }}-llvm${{ matrix.llvm }}.json
            backend/scripts/cache-explore workloads --history-summary reports/workloads/workload-history*.json --html \
              > reports/workloads/workload-history-report-${{ matrix.os }}-llvm${{ matrix.llvm }}.html
            {
              echo "### Workload benchmark history (${{ matrix.os }}, LLVM ${{ matrix.llvm }})"
              echo '```'
              cat reports/workloads/workload-history-summary-${{ matrix.os }}-llvm${{ matrix.llvm }}.txt
              echo '```'
              echo
              echo "HTML trend report is available in the workload benchmark history artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No workload benchmark history was generated."
          fi

      - name: Upload workload benchmark history
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: workload-benchmark-history-${{ matrix.os }}-llvm${{ matrix.llvm }}
          path: |
            reports/workloads/*.json
            reports/workloads/*.txt
            reports/workloads/*.html
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ matrix.os }}-llvm${{ matrix.llvm }}
          path: tests/integration/*.log
          if-no-files-found: ignore
