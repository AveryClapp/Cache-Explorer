openapi: 3.0.3
info:
  title: Cache Explorer API
  version: 1.0.0
  description: |
    Cache Explorer is a visual cache profiler that shows how code interacts with CPU cache hierarchies.
    This API provides endpoints for compiling and profiling C/C++/Rust code, sharing code snippets,
    and monitoring server health.
  contact:
    name: Cache Explorer
  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Local development server

tags:
  - name: profiling
    description: Code compilation and cache profiling endpoints
  - name: hardware
    description: Hardware profile catalog and model details
  - name: sharing
    description: URL shortening and code sharing endpoints
  - name: monitoring
    description: Health checks and metrics endpoints

paths:
  /profiles:
    get:
      tags:
        - hardware
      summary: List hardware profiles
      description: |
        Returns the hardware profiles supported by the simulator, including cache geometry,
        TLB defaults, prefetch capabilities, execution-core assumptions, memory latency,
        and topology details.
      responses:
        '200':
          description: Supported hardware profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareProfilesResponse'

  /profiles/{id}:
    get:
      tags:
        - hardware
      summary: Get one hardware profile
      description: Returns a single hardware profile by canonical id or supported alias.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: intel14
      responses:
        '200':
          description: Hardware profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareProfile'
        '404':
          description: Unknown hardware profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'

  /compile:
    post:
      tags:
        - profiling
      summary: Compile and profile code
      description: |
        Compiles the provided source code with cache instrumentation and runs the cache simulator.
        Returns detailed cache profiling results including hit/miss statistics, memory access patterns,
        and optimization suggestions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileRequest'
            examples:
              simple_c:
                summary: Simple C program
                value:
                  code: |
                    #include <stdio.h>
                    int main() {
                        int arr[100];
                        for (int i = 0; i < 100; i++) {
                            arr[i] = i;
                        }
                        return 0;
                    }
                  language: c
                  config: educational
                  optLevel: "-O0"
              multi_file:
                summary: Multi-file project
                value:
                  files:
                    - name: main.c
                      code: |
                        #include "helper.h"
                        int main() { return add(1, 2); }
                    - name: helper.h
                      code: |
                        int add(int a, int b);
                    - name: helper.c
                      code: |
                        int add(int a, int b) { return a + b; }
                  language: c
                  config: educational
      responses:
        '200':
          description: Successful compilation and profiling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResult'
              example:
                summary:
                  totalAccesses: 1000
                  hits: 850
                  misses: 150
                  hitRate: 0.85
                cacheConfig:
                  l1Size: 32768
                  l1Assoc: 8
                  lineSize: 64
                events:
                  - type: load
                    address: "0x7fff5fbff8c0"
                    line: 5
                    file: main.c
                    hit: true
                    level: L1
        '400':
          description: Compilation or execution error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'
              examples:
                compile_error:
                  summary: Compilation error
                  value:
                    type: compile_error
                    errors:
                      - line: 5
                        column: 10
                        severity: error
                        message: "use of undeclared identifier 'x'"
                        suggestion: "Variable or function not declared - check spelling or add declaration"
                    summary: "1 error"
                timeout:
                  summary: Execution timeout
                  value:
                    type: timeout
                    message: "Execution timed out after 60s"
                    suggestion: "Check for infinite loops, reduce input size, or increase timeout"

  /compare:
    post:
      tags:
        - profiling
      summary: Compare hardware profiles
      description: |
        Compiles and traces a single-file C/C++ program once, then replays the captured trace
        across multiple hardware profiles. This endpoint is available in direct development mode;
        sandbox deployments should use `/compile` per profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
            example:
              code: |
                #include <stdio.h>
                int main() {
                    int a[1024];
                    for (int i = 0; i < 1024; i++) a[i] = i;
                    printf("%d\n", a[1023]);
                    return 0;
                }
              language: c
              optLevel: "-O2"
              configs: [educational, intel14, amd, apple]
              limit: 200000
      responses:
        '200':
          description: Successful hardware profile comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareResult'
        '400':
          description: Compilation, execution, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'
        '422':
          description: Unsupported input for comparison mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'
        '501':
          description: Comparison endpoint unavailable in sandbox mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'

  /experiment:
    post:
      tags:
        - profiling
      summary: Run a hardware experiment
      description: |
        Runs named source variants of a single-file C/C++ program and compares each variant
        across multiple hardware profiles. Each variant is compiled and traced once, then
        replayed across all requested profiles. The summary includes cycle deltas relative
        to the first variant for each hardware profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentRequest'
            example:
              code: |
                #include <stdio.h>
                #ifndef RUN_TILED
                #define RUN_TILED 0
                #endif
                int main() { printf("%d\n", RUN_TILED); return 0; }
              language: c
              optLevel: "-O2"
              variants: [direct, "tiled:RUN_TILED=1"]
              configs: [educational, intel14]
              limit: 200000
      responses:
        '200':
          description: Successful hardware experiment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResult'
        '400':
          description: Compilation, execution, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'
        '422':
          description: Unsupported input for experiment mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'
        '501':
          description: Experiment endpoint unavailable in sandbox mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileError'

  /health:
    get:
      tags:
        - monitoring
      summary: Health check endpoint
      description: Returns the health status of the server including database connectivity, sandbox availability, and configuration.
      responses:
        '200':
          description: Server health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                uptime: 3600
                database: connected
                sandbox: enabled
                mode: production
                config:
                  timeouts:
                    default: 60000
                    max: 300000
                    min: 5000
                  rateLimit:
                    maxRequestsPerMinute: 30

  /metrics:
    get:
      tags:
        - monitoring
      summary: Prometheus metrics endpoint
      description: Returns server metrics in Prometheus text format for monitoring and alerting.
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP cache_explorer_requests_total Total number of requests
                # TYPE cache_explorer_requests_total counter
                cache_explorer_requests_total{type="compile"} 150
                cache_explorer_requests_total{type="share"} 25
                # HELP cache_explorer_errors_total Total number of errors
                # TYPE cache_explorer_errors_total counter
                cache_explorer_errors_total{type="compile"} 5

  /shorten:
    post:
      tags:
        - sharing
      summary: Create a short URL for state
      description: Creates a short URL that can be used to share the current editor state including code, configuration, and results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortenRequest'
            example:
              state:
                code: "int main() { return 0; }"
                config: educational
                optLevel: "-O0"
      responses:
        '200':
          description: Short URL created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortenResponse'
              example:
                id: abc123
                url: /s/abc123
        '400':
          description: No state provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No state provided
        '500':
          description: Failed to create short URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to create short URL

  /s/{id}:
    get:
      tags:
        - sharing
      summary: Get short URL data
      description: Retrieves the state associated with a short URL ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The short URL identifier
          schema:
            type: string
          example: abc123
      responses:
        '200':
          description: State retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortUrlDataResponse'
              example:
                state:
                  code: "int main() { return 0; }"
                  config: educational
                  optLevel: "-O0"
        '404':
          description: Link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Link not found
        '500':
          description: Failed to retrieve link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to retrieve link

  /api/share:
    post:
      tags:
        - sharing
      summary: Create a share link (alternative endpoint)
      description: Alternative endpoint for creating shareable links. Uses 'data' instead of 'state' for the payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            example:
              data:
                code: "int main() { return 0; }"
                config: educational
      responses:
        '200':
          description: Share link created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
              example:
                code: xyz789
                url: /s/xyz789
        '400':
          description: No data provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No data provided
        '500':
          description: Failed to create short URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to create short URL

  /api/s/{code}:
    get:
      tags:
        - sharing
      summary: Get share data (alternative endpoint)
      description: Alternative endpoint for retrieving shared data. Returns 'data' instead of 'state'.
      parameters:
        - name: code
          in: path
          required: true
          description: The share code identifier
          schema:
            type: string
          example: xyz789
      responses:
        '200':
          description: Data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareDataResponse'
              example:
                data:
                  code: "int main() { return 0; }"
                  config: educational
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not found
        '500':
          description: Failed to retrieve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to retrieve

  /api/docs:
    get:
      tags:
        - monitoring
      summary: Get OpenAPI specification (YAML)
      description: Returns the OpenAPI specification for this API in YAML format.
      responses:
        '200':
          description: OpenAPI specification in YAML format
          content:
            text/yaml:
              schema:
                type: string

  /api/docs.json:
    get:
      tags:
        - monitoring
      summary: Get OpenAPI specification (JSON)
      description: Returns the OpenAPI specification for this API in JSON format.
      responses:
        '200':
          description: OpenAPI specification in JSON format
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    HardwareProfilesResponse:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/HardwareProfile'

    HardwareProfile:
      type: object
      properties:
        id:
          type: string
          example: intel14
        aliases:
          type: array
          items:
            type: string
          example: [intel14]
        displayName:
          type: string
          example: Intel 14th Gen
        vendor:
          type: string
          example: Intel
        architecture:
          type: string
          example: x86_64
        class:
          type: string
          example: client
        modelConfidence:
          type: string
          example: directional
        modelCoverage:
          type: object
          additionalProperties:
            type: string
          example:
            cacheHierarchy: modeled
            executionCore: estimated
            simd: metadata-only
        validation:
          $ref: '#/components/schemas/HardwareProfileValidation'
        notes:
          type: string
          nullable: true
        details:
          $ref: '#/components/schemas/HardwareProfileDetails'

    HardwareProfileDetails:
      type: object
      properties:
        cache:
          type: object
          properties:
            inclusion:
              type: string
              example: non-inclusive-non-exclusive
            levels:
              type: object
              properties:
                l1d:
                  $ref: '#/components/schemas/HardwareProfileCacheLevel'
                l1i:
                  $ref: '#/components/schemas/HardwareProfileCacheLevel'
                l2:
                  $ref: '#/components/schemas/HardwareProfileCacheLevel'
                l3:
                  $ref: '#/components/schemas/HardwareProfileCacheLevel'
        tlb:
          type: object
          properties:
            dtlb:
              $ref: '#/components/schemas/HardwareProfileTlb'
            itlb:
              $ref: '#/components/schemas/HardwareProfileTlb'
        prefetch:
          $ref: '#/components/schemas/HardwareProfilePrefetch'
        executionCore:
          $ref: '#/components/schemas/HardwareProfileExecutionCore'
        memory:
          $ref: '#/components/schemas/HardwareProfileMemory'
        topology:
          $ref: '#/components/schemas/HardwareProfileTopology'

    HardwareProfileCacheLevel:
      type: object
      properties:
        sizeKB:
          type: integer
          example: 48
        associativity:
          type: integer
          example: 12
        lineSize:
          type: integer
          example: 64
        sets:
          type: integer
          example: 64
        replacement:
          type: string
          example: pseudo-lru
        writePolicy:
          type: string
          example: write-back

    HardwareProfileTlb:
      type: object
      properties:
        entries:
          type: integer
          example: 64
        associativity:
          type: integer
          example: 4
        pageSize:
          type: integer
          example: 4096

    HardwareProfilePrefetch:
      type: object
      properties:
        activePolicy:
          type: string
          example: adaptive
        activeDegree:
          type: integer
          example: 4
        l1Stream:
          type: boolean
        l1Stride:
          type: boolean
        l1Degree:
          type: integer
        l2Stream:
          type: boolean
        l2Adjacent:
          type: boolean
        l2Degree:
          type: integer
        l2Streams:
          type: integer
        l2MaxDistance:
          type: integer
        l3Prefetch:
          type: boolean
        pointerPrefetch:
          type: boolean
        dynamicDegree:
          type: boolean

    HardwareProfileExecutionCore:
      type: object
      properties:
        model:
          type: string
          example: analytical-ooo
        issueWidth:
          type: integer
          example: 4
        robSize:
          type: integer
          example: 192
        hideableCycles:
          type: integer
          example: 48
        branchMispredictPenalty:
          type: integer
          example: 14
        branchPredictor:
          type: string
          example: bimodal-2bit
        branchPredictorEntries:
          type: integer
          example: 1024
        vectorBits:
          type: integer
          example: 256
        vectorIsa:
          type: string
          example: avx2-class
        loadPorts:
          type: integer
          example: 2
        storePorts:
          type: integer
          example: 1
        integerPipelines:
          type: integer
          example: 4
        fpPipelines:
          type: integer
          example: 2

    HardwareProfileMemory:
      type: object
      properties:
        l1HitCycles:
          type: integer
          example: 4
        l2HitCycles:
          type: integer
          example: 12
        l3HitCycles:
          type: integer
          example: 40
        dramCycles:
          type: integer
          example: 200
        tlbMissPenaltyCycles:
          type: integer
          example: 7
        l1BandwidthBytesPerCycle:
          type: integer
          example: 96
        l2BandwidthBytesPerCycle:
          type: integer
          example: 64
        l3BandwidthBytesPerCycle:
          type: integer
          example: 32
        dramBandwidthGBs:
          type: integer
          example: 90
        maxMemoryLevelParallelism:
          type: integer
          example: 10

    HardwareProfileTopology:
      type: object
      properties:
        activeCores:
          type: integer
          example: 1
        l1Scope:
          type: string
          example: private-per-core
        l2Scope:
          type: string
          example: private-to-modeled-core
        l3Scope:
          type: string
          example: shared-last-level
        coherence:
          type: string
          example: not-applicable

    HardwareProfileValidation:
      type: object
      properties:
        source:
          type: string
          example: architecture references and simulator presets
        confidence:
          type: string
          example: directional
        caveats:
          type: array
          items:
            type: string
          example:
            - Execution, SIMD, bandwidth, and dependency behavior are modeled as estimates unless marked calibrated.

    CompileRequest:
      type: object
      properties:
        code:
          type: string
          description: Source code to compile (for single-file projects)
          example: |
            #include <stdio.h>
            int main() { printf("Hello\n"); return 0; }
        files:
          type: array
          description: Array of source files (for multi-file projects)
          items:
            $ref: '#/components/schemas/SourceFile'
        config:
          type: string
          description: Cache configuration preset
          enum: [educational, desktop, server, mobile, custom]
          default: educational
          example: educational
        optLevel:
          type: string
          description: Compiler optimization level
          enum: ["-O0", "-O1", "-O2", "-O3", "-Os"]
          default: "-O0"
          example: "-O0"
        language:
          type: string
          description: Programming language
          enum: [c, cpp, rust]
          default: c
          example: c
        sample:
          type: integer
          description: Sample rate (1 = every access, 10 = every 10th access)
          minimum: 1
          default: 1
          example: 1
        limit:
          type: integer
          description: Maximum number of events to capture
          default: 5000000
          example: 100000
        timeout:
          type: integer
          description: Execution timeout in milliseconds
          minimum: 5000
          maximum: 300000
          default: 60000
          example: 60000
        prefetch:
          type: string
          description: Prefetch policy to simulate
          enum: [none, next-line, stride, stream]
          default: none
          example: none
        customConfig:
          $ref: '#/components/schemas/CustomCacheConfig'
        defines:
          type: array
          description: Preprocessor definitions
          items:
            $ref: '#/components/schemas/PreprocessorDefine'

    CompareRequest:
      type: object
      properties:
        code:
          type: string
          description: Single-file C/C++ source code to compile and compare
        configs:
          type: array
          description: Hardware profile ids to compare
          items:
            type: string
          default: [educational, intel, amd, apple]
          example: [educational, intel14, amd, apple]
        optLevel:
          type: string
          description: Compiler optimization level
          enum: ["-O0", "-O1", "-O2", "-O3", "-Os"]
          default: "-O0"
        language:
          type: string
          description: Programming language
          enum: [c, cpp]
          default: c
        sample:
          type: integer
          description: Sample rate (1 = every access, 10 = every 10th access)
          minimum: 1
          default: 1
        limit:
          type: integer
          description: Maximum number of events to capture
          default: 1000000
        prefetch:
          type: string
          description: Prefetch policy to simulate
          enum: [none, next, next-line, stride, stream, adaptive, intel]
          default: none
        fast:
          type: boolean
          description: Disable 3C miss classification for faster simulation
          default: false
        cacheSegments:
          type: boolean
          description: Cache repeated loop segments during simulation
          default: false
        defines:
          type: array
          description: Preprocessor definitions
          items:
            $ref: '#/components/schemas/PreprocessorDefine'

    ExperimentRequest:
      allOf:
        - $ref: '#/components/schemas/CompareRequest'
        - type: object
          properties:
            variants:
              type: array
              description: Variant specs in the form name or name:DEFINE=value,DEFINE2
              items:
                type: string
              default: [baseline]
              example: [direct, "tiled:RUN_TILED=1"]

    SourceFile:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          description: File name including extension
          example: main.c
        code:
          type: string
          description: File contents
          example: "int main() { return 0; }"

    CustomCacheConfig:
      type: object
      description: Custom cache configuration parameters
      properties:
        l1Size:
          type: integer
          description: L1 cache size in bytes
          example: 32768
        l1Assoc:
          type: integer
          description: L1 cache associativity
          example: 8
        lineSize:
          type: integer
          description: Cache line size in bytes
          example: 64
        l2Size:
          type: integer
          description: L2 cache size in bytes
          example: 262144
        l2Assoc:
          type: integer
          description: L2 cache associativity
          example: 4
        l3Size:
          type: integer
          description: L3 cache size in bytes
          example: 8388608
        l3Assoc:
          type: integer
          description: L3 cache associativity
          example: 16

    PreprocessorDefine:
      type: object
      properties:
        name:
          type: string
          description: Define name
          example: DEBUG
        value:
          type: string
          description: Define value (optional)
          example: "1"

    CompileResult:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/CacheSummary'
        cacheConfig:
          $ref: '#/components/schemas/CacheConfigResult'
        events:
          type: array
          description: Memory access events with cache results
          items:
            $ref: '#/components/schemas/CacheEvent'
        hotLines:
          type: array
          description: Source lines with most cache activity
          items:
            $ref: '#/components/schemas/HotLine'
        suggestions:
          type: array
          description: Optimization suggestions
          items:
            type: string

    CompareResult:
      type: object
      properties:
        source:
          type: string
          description: Source file used for the comparison
        summary:
          type: array
          description: Compact per-profile hardware comparison summary
          items:
            $ref: '#/components/schemas/HardwareCompareSummary'
        configs:
          type: object
          description: Full per-profile analysis results keyed by hardware config id
          additionalProperties:
            $ref: '#/components/schemas/CompileResult'

    HardwareCompareSummary:
      type: object
      properties:
        config:
          type: string
          example: intel14
        primaryBottleneck:
          type: string
          example: memory
        estimatedCycles:
          type: integer
          example: 651742
        confidence:
          type: string
          example: medium
        bottleneckShare:
          type: number
          format: float
          example: 0.151
        topSource:
          type: object
          nullable: true
          properties:
            file:
              type: string
              example: main.c
            line:
              type: integer
              example: 12
            subsystem:
              type: string
              example: memory
            cycles:
              type: integer
              example: 58803
        events:
          type: integer
          example: 200000

    ExperimentResult:
      type: object
      properties:
        source:
          type: string
          description: Source file used for the experiment
        baselineVariant:
          type: string
          description: First variant, used as the per-profile delta baseline
          example: direct
        summary:
          type: array
          description: Flattened variant/profile experiment summary
          items:
            $ref: '#/components/schemas/HardwareExperimentSummary'
        variants:
          type: object
          description: Full comparison result per variant
          additionalProperties:
            $ref: '#/components/schemas/CompareResult'

    HardwareExperimentSummary:
      allOf:
        - $ref: '#/components/schemas/HardwareCompareSummary'
        - type: object
          properties:
            variant:
              type: string
              example: tiled
            variantSpec:
              type: string
              example: "tiled:RUN_TILED=1"
            cycleDelta:
              type: integer
              description: Estimated-cycle delta from the baseline variant on the same hardware profile
              example: -1875
            cycleDeltaPercent:
              type: number
              format: float
              description: Fractional cycle delta from baseline; -0.01 means 1% fewer cycles
              example: -0.003

    CacheSummary:
      type: object
      properties:
        totalAccesses:
          type: integer
          description: Total number of memory accesses
          example: 10000
        hits:
          type: integer
          description: Number of cache hits
          example: 8500
        misses:
          type: integer
          description: Number of cache misses
          example: 1500
        hitRate:
          type: number
          format: float
          description: Cache hit rate (0.0 to 1.0)
          example: 0.85
        l1Hits:
          type: integer
          description: L1 cache hits
          example: 7000
        l2Hits:
          type: integer
          description: L2 cache hits
          example: 1200
        l3Hits:
          type: integer
          description: L3 cache hits
          example: 300

    CacheConfigResult:
      type: object
      properties:
        l1Size:
          type: integer
          example: 32768
        l1Assoc:
          type: integer
          example: 8
        lineSize:
          type: integer
          example: 64
        l2Size:
          type: integer
          example: 262144
        l3Size:
          type: integer
          example: 8388608

    CacheEvent:
      type: object
      properties:
        type:
          type: string
          enum: [load, store]
          description: Type of memory access
          example: load
        address:
          type: string
          description: Memory address accessed
          example: "0x7fff5fbff8c0"
        size:
          type: integer
          description: Size of access in bytes
          example: 4
        line:
          type: integer
          description: Source code line number
          example: 10
        file:
          type: string
          description: Source file name
          example: main.c
        hit:
          type: boolean
          description: Whether this was a cache hit
          example: true
        level:
          type: string
          enum: [L1, L2, L3, MEMORY]
          description: Cache level that served the request
          example: L1

    HotLine:
      type: object
      properties:
        line:
          type: integer
          description: Source line number
          example: 15
        file:
          type: string
          description: Source file name
          example: main.c
        accesses:
          type: integer
          description: Number of accesses from this line
          example: 500
        hitRate:
          type: number
          format: float
          description: Hit rate for this line
          example: 0.92

    CompileError:
      type: object
      properties:
        type:
          type: string
          enum: [compile_error, linker_error, runtime_error, timeout, server_error, unknown_error, validation_error]
          description: Type of error
          example: compile_error
        errors:
          type: array
          description: List of compilation errors (for compile_error type)
          items:
            $ref: '#/components/schemas/CompileErrorDetail'
        message:
          type: string
          description: Error message
          example: "Undefined symbol: foo"
        suggestion:
          type: string
          description: Helpful suggestion for fixing the error
          example: "Check that the function is defined, not just declared"
        summary:
          type: string
          description: Summary of errors (e.g., "3 errors, 1 warning")
          example: "1 error"
        raw:
          type: string
          description: Raw error output from compiler
        exitCode:
          type: integer
          description: Exit code from compiler/runtime

    CompileErrorDetail:
      type: object
      properties:
        line:
          type: integer
          description: Line number of the error
          example: 5
        column:
          type: integer
          description: Column number of the error
          example: 10
        severity:
          type: string
          enum: [error, warning]
          description: Severity of the issue
          example: error
        message:
          type: string
          description: Error message from compiler
          example: "use of undeclared identifier 'x'"
        suggestion:
          type: string
          description: Suggestion for fixing the error
          example: "Variable or function not declared - check spelling or add declaration"
        sourceLine:
          type: string
          description: The source code line containing the error
          example: "    int y = x + 1;"
        caret:
          type: string
          description: Caret indicator showing error position
          example: "            ^"
        notes:
          type: array
          description: Additional notes from the compiler
          items:
            type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall health status
          example: healthy
        uptime:
          type: number
          description: Server uptime in seconds
          example: 3600.5
        database:
          type: string
          description: Database connection status
          example: connected
        sandbox:
          type: string
          enum: [enabled, disabled]
          description: Docker sandbox status
          example: enabled
        mode:
          type: string
          enum: [production, development]
          description: Server running mode
          example: production
        config:
          type: object
          properties:
            timeouts:
              type: object
              properties:
                default:
                  type: integer
                  example: 60000
                max:
                  type: integer
                  example: 300000
                min:
                  type: integer
                  example: 5000
            rateLimit:
              type: object
              properties:
                maxRequestsPerMinute:
                  type: integer
                  example: 30

    ShortenRequest:
      type: object
      required:
        - state
      properties:
        state:
          type: object
          description: State object to store (typically includes code, config, results)
          additionalProperties: true

    ShortenResponse:
      type: object
      properties:
        id:
          type: string
          description: The short URL identifier
          example: abc123
        url:
          type: string
          description: The relative URL path
          example: /s/abc123

    ShortUrlDataResponse:
      type: object
      properties:
        state:
          type: object
          description: The stored state object
          additionalProperties: true

    ShareRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: Data object to store
          additionalProperties: true

    ShareResponse:
      type: object
      properties:
        code:
          type: string
          description: The share code identifier
          example: xyz789
        url:
          type: string
          description: The relative URL path
          example: /s/xyz789

    ShareDataResponse:
      type: object
      properties:
        data:
          type: object
          description: The stored data object
          additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: An error occurred
